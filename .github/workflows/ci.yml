name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-serve.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-serve.txt
          pip install ruff pytest
      - name: Lint
        run: ruff check app api visionguard tests
      - name: Test
        run: pytest -v

  docker-build:
    needs: lint-and-test          # only build if lint and tests passed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build -t 22i0896_a2_ops-web:ci .
      - name: Show image size
        run: docker images 22i0896_a2_ops-web
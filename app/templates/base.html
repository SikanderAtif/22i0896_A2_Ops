<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VisionGuard{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('main.index') }}"><span class="logo">VG</span> VisionGuard</a>
    <nav>
      <a href="{{ url_for('main.index') }}" class="{{ 'active' if request.endpoint == 'main.index' }}">Upload</a>
      <a href="{{ url_for('main.history') }}" class="{{ 'active' if request.endpoint == 'main.history' }}">History</a>
      <a href="{{ url_for('main.health') }}">Health</a>
    </nav>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
  <footer>VisionGuard · 22i0896_A2_Ops · model {{ model_info.name }} v{{ model_info.version }}
    {% if model_info.mode == 'remote' %}· served by cloud API {{ model_info.api_url }}{% endif %}</footer></body>
</html>

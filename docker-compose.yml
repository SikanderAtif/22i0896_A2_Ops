name: 22i0896_a2_ops

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data      # named volume: data survives container removal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # deliberately NO "ports:" -> the database is reachable only inside the Compose network

  web:
    build: .
    image: 22i0896_a2_ops-web:latest
    depends_on:
      db:
        condition: service_healthy            # wait until Postgres actually accepts connections
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MODEL_PATH: /app/model/champion.keras
      MODEL_METADATA: /app/model/metadata.json
      SECRET_KEY: ${SECRET_KEY}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
    volumes:
      - ./model:/app/model:ro                # champion model mounted read-only from the host
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  pgdata: